name: Daily Stock Ingest

# Disabled by default (see `if:` condition on the job below).
#
# Why this workflow exists:
#   Pulls fresh OHLCV bars from Yahoo Finance and pushes them into MinIO
#   so the Silver/Gold layers stay up-to-date without a scheduled task
#   on the local machine. It's the same `scripts.ingest_all` entry-point
#   used by the in-app "Refresh" button.
#
# Why it is gated behind `if: false`:
#   The CI runner is a cloud Ubuntu image - it cannot reach MinIO running
#   on the developer's WSL2 instance unless a public tunnel is exposed.
#   We have configured an ngrok free-tier tunnel for that, but the
#   developer's workstation is not online 24/7, so the scheduled runs
#   reliably fail when the laptop is off (the first run on 2026-10-17
#   failed with "MINIO_NGROK_URL secret is empty" / "host unreachable").
#
# How to demo / re-enable:
#   1. Start the local stack:    docker compose --profile all up -d
#   2. Start the ngrok tunnel:   ngrok tcp 9000  (paste the URL into
#                                 Settings -> Secrets -> MINIO_NGROK_URL)
#   3. Trigger manually:         Actions -> Daily Stock Ingest -> Run workflow
#   4. To re-enable the schedule: remove the `if: false` line below and
#                                 commit. CI runs every day at 18:00 ICT.

on:
  schedule:
    - cron: '0 11 * * *'  # Disabled by job-level `if: false` below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest OHLCV from Yahoo Finance -> MinIO
    # Disabled: see the comment block at the top of this file for why
    # and how to re-enable. Flip this to `true` (or remove the line)
    # when the developer workstation is guaranteed online for the run.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify MinIO reachable
        env:
          NGROK_URL: ${{ secrets.MINIO_NGROK_URL }}
        run: |
          if [ -z "$NGROK_URL" ]; then
            echo "::error::MINIO_NGROK_URL secret is empty"
            exit 1
          fi
          echo "Probing $NGROK_URL/minio/health/live"
          # -H "ngrok-skip-browser-warning: 1" bypasses the free-tier
          # interstitial that ngrok returns to browser-like User-Agents.
          curl -fsS --max-time 10 \
            -H "ngrok-skip-browser-warning: 1" \
            "$NGROK_URL/minio/health/live"
          echo

      - name: Run incremental ingest
        working-directory: backend
        env:
          # Storage backend
          STORAGE_BACKEND: minio
          MINIO_ENDPOINT: ${{ secrets.MINIO_HOST }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_SECURE: 'true'
          # Kafka/Iceberg disabled for remote ingest
          KAFKA_ENABLED: 'false'
          ICEBERG_ENABLED: 'false'
        run: |
          python -m scripts.ingest_all \
            --interval 1d \
            --lookback 30 \
            --batch 10 \
            --delay 0.3

      - name: Summary
        if: always()
        run: |
          echo "### Daily Ingest Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
