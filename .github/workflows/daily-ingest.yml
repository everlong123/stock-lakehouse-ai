name: Daily Stock Ingest

# Runs every day at 11:00 UTC = 18:00 Vietnam (UTC+7)
# Can also be triggered manually from the Actions tab.

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest OHLCV from Yahoo Finance -> MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify MinIO reachable
        env:
          NGROK_URL: ${{ secrets.MINIO_NGROK_URL }}
        run: |
          if [ -z "$NGROK_URL" ]; then
            echo "::error::MINIO_NGROK_URL secret is empty"
            exit 1
          fi
          echo "Probing $NGROK_URL/minio/health/live"
          # -H "ngrok-skip-browser-warning: 1" bypasses the free-tier
          # interstitial that ngrok returns to browser-like User-Agents.
          curl -fsS --max-time 10 \
            -H "ngrok-skip-browser-warning: 1" \
            "$NGROK_URL/minio/health/live"
          echo

      - name: Run incremental ingest
        working-directory: backend
        env:
          # Storage backend
          STORAGE_BACKEND: minio
          MINIO_ENDPOINT: ${{ secrets.MINIO_HOST }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_SECURE: 'true'
          # Kafka/Iceberg disabled for remote ingest
          KAFKA_ENABLED: 'false'
          ICEBERG_ENABLED: 'false'
          # `ingest_all` arg parser only accepts --batch / --delay
        run: |
          python -m scripts.ingest_all \
            --interval 1d \
            --lookback 30 \
            --batch 10 \
            --delay 0.3

      - name: Summary
        if: always()
        run: |
          echo "### Daily Ingest Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
