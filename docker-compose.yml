services:
  # ── Database (lưu pipeline metadata, AI chat history) ─────────────────────
  mysql:
    image: mysql:8.4
    container_name: stock-lakehouse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: stock_lakehouse
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  # ── Object Storage (S3-compatible) ─────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: stock-lakehouse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app_net

  # ── Apache Iceberg REST Catalog ─────────────────────────────────────────────
  iceberg-rest:
    image: tabulario/iceberg-rest:0.9.0
    container_name: stock-lakehouse-iceberg-rest
    restart: unless-stopped
    environment:
      CATALOG_sqlite__catalog__uri: "sqlite:///var/lib/iceberg/iceberg_rest.db"
      CATALOG_s3__endpoint: "http://minio:9000"
      CATALOG_s3__access-key__id: "minioadmin"
      CATALOG_s3__secret-access-key: "minioadmin"
      CATALOG_s3__region: "us-east-1"
      CATALOG_properties: "--unauthenticated"
    ports:
      - "8181:8181"
    volumes:
      - iceberg_rest_data:/var/lib/iceberg
    depends_on:
      - minio
    networks:
      - app_net

  # ── Apache Kafka (Real-time Streaming) ─────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: stock-lakehouse-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app_net

  # ── Backend API (FastAPI) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stock-lakehouse-backend:latest
    container_name: stock-lakehouse-backend
    restart: unless-stopped
    environment:
      # The .env file on the host is loaded by Settings(BaseSettings) via env_file,
      # but we also pass the most critical overrides here so the container is
      # self-sufficient when started on its own.
      APP_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "123456"
      MYSQL_DATABASE: stock_lakehouse
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USE_KAFKA: "false"
      USE_ICEBERG: "false"
      DATA_SOURCE: multi_source
      CORS_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80"
      # Optional - leave blank for local-router fallback:
      LLM_PROVIDER: local
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # Backend's main.py loads .env from parents[1] (i.e. /app/.env).
      # Mount the project .env there so runtime config matches local dev.
      - type: bind
        source: ./backend/.env
        target: /app/.env
        read_only: true
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - app_net

  # ── Frontend (Vite + React) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: stock-lakehouse-frontend:latest
    container_name: stock-lakehouse-frontend
    restart: unless-stopped
    ports:
      # 8080 is occupied on this host (Cursor AgentService); use 8081.
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app_net

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  minio_data:
  iceberg_rest_data:
  kafka_data:
