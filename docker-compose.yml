# Stock Lakehouse Platform — Modern Compose Stack
#
# Chạy theo profile:
#   docker compose --profile infra up -d   (chỉ MySQL/MinIO)
#   docker compose --profile app  up -d   (backend + frontend + scheduler, kèm infra)
#   docker compose --profile all  up -d   (mọi thứ, mặc định cho demo)
#
# Hoặc dùng Makefile:
#   make up-infra / up-app / up-all / down / logs / health
#
# DATA PERSISTENCE (since 2026-10-14)
# -----------------------------------
# Migration away from Docker Desktop:
#   * The 56 GB ext4 data disk that used to live in
#     D:\DockerDesktopWSL\disk\docker_data.vhdx has been renamed to
#     D:\DockerDesktopWSL_BACKUP\disk\docker_data.vhdx for safekeeping.
#   * Docker Engine is now installed natively inside the Ubuntu-24.04 WSL2
#     distro (no Docker Desktop service, no host-services IPC bridge — the
#     old crash mode).
#   * Bind mounts live under /var/lib/docker-data inside the WSL2 ext4 root
#     (NOT under /mnt/d, because writing 11 GB of Parquet from a Docker
#     container through the 9P/NTFS bridge is ~20 MB/min — ext4→ext4 is
#     ~1 GB/min). The data still appears under the project in
#     \\wsl$\Ubuntu-24.04\var\lib\docker-data\... if you need to inspect
#     it from Windows.
#
# Old named volumes (mysql_data, minio_data, ...) were restored from the
# vhdx backup via qemu-nbd and rsync; see scripts/migrate-old-volumes.sh.

# Mỗi service liệt kê TẤT CẢ profiles nó thuộc về.
# Mục đích: khi gọi --profile app, các infra services vẫn được
# pull vào config (để resolve depends_on của backend/frontend).

services:
  # ════════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE — hạ tầng dữ liệu (MySQL, Object Storage)
  # Profiles: infra, app, all (cần ở app để backend.depends_on resolve)
  # ════════════════════════════════════════════════════════════════════════════

  mysql:
    profiles: ["minimal", "infra", "app", "all"]
    image: mirror.gcr.io/library/mysql:8.4
    container_name: stock-lakehouse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: stock_lakehouse
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # MySQL data restored from Docker Desktop backup vhdx on 2026-10-14.
      # Host path is the WSL2 ext4 root (fast I/O); survives because Docker
      # Engine inside WSL2 sees the same filesystem across reboots.
      - /var/lib/docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_net

  minio:
    profiles: ["minimal", "infra", "app", "all"]
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: stock-lakehouse-minio:latest
    container_name: stock-lakehouse-minio
    restart: unless-stopped
    # Use host network so MinIO binds directly to WSL2's eth0 IP.
    # This avoids Docker bridge NAT issues where response packets from
    # 172.17.0.x don't route back to the Windows host correctly.
    network_mode: host
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      # MinIO Bronze/Silver/Gold Parquet data. The 11 GB legacy dataset
      # is copied once from the Docker Desktop backup vhdx into this
      # directory by the `minio-data-restore` one-shot container (see
      # below). After that copy completes, the bind mount below is the
      # authoritative copy and the vhdx backup is just a safety net.
      - /var/lib/docker-data/minio:/data
    # The healthcheck is intentionally omitted: every healthcheck call
    # adds CPU pressure to MinIO while it's already serving the backend's
    # parallel list_objects calls, and Docker will restart the container
    # on any transient curl failure. We rely on the WSL host being able
    # to reach :9000 instead.

  # ════════════════════════════════════════════════════════════════════════════
  # APPLICATION — Backend API + Frontend SPA
  # Profile: app | all
  # ════════════════════════════════════════════════════════════════════════════

  backend:
    profiles: ["minimal", "app", "all"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stock-lakehouse-backend:latest
    container_name: stock-lakehouse-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "123456"
      MYSQL_DATABASE: stock_lakehouse
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DATA_SOURCE: multi_source
      CORS_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80"
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: "${GEMINI_API_KEY:-AQ.Ab8RN6Ic6DWpYWtAXDsR4vWki5tSS-LG6s5LK0P9K1iHEjeLfw}"
    env_file:
      - path: ./backend/.env
        required: false
    extra_hosts:
      # The MinIO service runs with `network_mode: host`, so it never joins
      # the app_net bridge and therefore has no DNS entry there. Without this
      # the backend cannot resolve "minio" and dies with
      #   NameResolutionError: Failed to resolve 'minio'
      # 172.18.0.1 is the bridge gateway, which is the WSL2 host — and
      # MinIO, running on the host network, is listening on that host.
      - "minio:172.18.0.1"
    volumes:
      # Backend's main.py loads .env from parents[1] (i.e. /app/.env).
      # Mount the project .env there so runtime config matches local dev.
      - type: bind
        source: ./backend/.env
        target: /app/.env
        read_only: true
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_net

  frontend:
    profiles: ["minimal", "app", "all"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: stock-lakehouse-frontend:latest
    container_name: stock-lakehouse-frontend
    restart: unless-stopped
    ports:
      # 8080 is occupied on this host (Cursor AgentService); use 8081.
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app_net

  # ════════════════════════════════════════════════════════════════════════════
  # SCHEDULER — the 24/7 cron that drives the batch jobs
  # Profile: app | all
  # ════════════════════════════════════════════════════════════════════════════
  #
  # WHY A SEPARATE CONTAINER
  # ------------------------
  # The previous schedule ran inside the API process (a background thread)
  # or as a standalone `schedule`-library script. Both die with the
  # machine and neither is supervised: a container recreate, an OOM kill
  # or a host reboot silently ends the schedule until somebody notices.
  #
  # A real cron in its own container is supervised by the runtime.
  # `restart: unless-stopped` brings it back, and the timetable lives in
  # `backend/crontab`, which is a file in the repository rather than a
  # runtime decision.
  #
  # WHY IT REUSES THE BACKEND IMAGE
  # -------------------------------
  # The jobs are ordinary Python scripts that import the same application
  # package. A second image would be a second dependency set to keep in
  # sync for no benefit.
  #
  # WHY THE TIMEZONE IS PINNED TO UTC
  # --------------------------------
  # The crontab's times are written in UTC, and this makes that explicit
  # rather than depending on the host's timezone. A VPS deployed in a
  # different zone would otherwise run the EOD batch at the wrong hour.
  scheduler:
    profiles: ["app", "all"]
    image: stock-lakehouse-backend:latest
    container_name: stock-lakehouse-scheduler
    restart: unless-stopped
    # cron has to run as root: it reads /etc/cron.d, which it refuses to
    # load for a non-root user, and it needs the privilege to switch to
    # the user named in the crontab's sixth field.
    user: root
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: production
      TZ: UTC
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "123456"
      MYSQL_DATABASE: stock_lakehouse
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DATA_SOURCE: multi_source
      LOG_LEVEL: INFO
      # The EOD batch is driven by cron here, so the in-process refresh
      # thread stays OFF - otherwise the two would fetch the same symbols
      # at the same time.
      AUTO_REFRESH_ENABLED: "${AUTO_REFRESH_ENABLED:-false}"
      # The batch produces the next-session forecast for the symbols that
      # have a trained model.
      #
      # The model MUST be one that is trained for (almost) every symbol:
      # measured on the lakehouse (13/11/2026) there are 973
      # `linear_regression` models, 8 `arima` and 6 `lstm`. Pointing this
      # at `arima` would skip ~965 symbols silently.
      AUTO_PREDICT_ENABLED: "${AUTO_PREDICT_ENABLED:-true}"
      AUTO_PREDICT_MODEL: "${AUTO_PREDICT_MODEL:-linear_regression}"
    extra_hosts:
      - "minio:172.18.0.1"
    volumes:
      - type: bind
        source: ./backend/crontab
        target: /etc/cron.d/stock-lakehouse
        read_only: true
      # The trained models live on the local filesystem, not in MinIO. They
      # MUST be mounted, or the batch finds no model and the forecast step
      # is skipped.
      - type: bind
        source: ./backend/data/models
        target: /app/data/models
      - type: bind
        source: ./backend/logs
        target: /app/logs
    # `cron -f` runs in the foreground so Docker can supervise it.
    command: ["cron", "-f", "-L", "15"]
    networks:
      - app_net

  # One-shot: copy MinIO data from the legacy Docker Desktop backup vhdx
  # into /var/lib/docker-data/minio so the MinIO service can serve it.
  # Why a container and not a host-level rsync: the host-level rsync from
  # the nbd-mounted vhdx caused the WSL2 distro to crash repeatedly
  # (WSL_E_USER_NOT_FOUND / catastrophic failure). Running rsync inside a
  # container keeps the heavy I/O away from the WSL2 control plane and
  # the WSL2 instance stays up reliably.
  #
  # Usage:
  #   wsl -d Ubuntu-24.04 -- qemu-nbd -c /dev/nbd0 /mnt/d/DockerDesktopWSL_BACKUP/disk/docker_data.vhdx
  #   wsl -d Ubuntu-24.04 -- mount -o ro /dev/nbd0 /mnt/backup-data
  #   docker compose --profile all up minio-data-restore
  #
  # After it finishes, this container exits 0 and you can start the
  # stock-lakehouse-ai stack normally.
  minio-data-restore:
    profiles: ["restore"]
    image: alpine:3.19
    container_name: stock-lakehouse-minio-restore
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f /dst/.minio.sys/format.json ]; then
          echo "[minio-data-restore] destination already populated; skipping"
          exit 0
        fi
        echo "[minio-data-restore] starting rsync from /src to /dst"
        apk add --no-cache rsync >/dev/null
        rsync -a --info=progress2 /src/ /dst/ 2>&1
        echo "[minio-data-restore] done"
    volumes:
      - /mnt/backup-data/data/docker/volumes/stock-lakehouse-ai_minio_data/_data:/src:ro
      - /var/lib/docker-data/minio:/dst

# ── Networks ────────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ── Volumes (legacy named volumes) ─────────────────────────────────────────
# All stateful services now use bind mounts on /var/lib/docker-data instead.
# The named volumes below are kept ONLY for backward compatibility with
# `docker compose down -v` and any external tooling that references them by
# name. They are empty unless something in this file still mounts them.
#
# NOTE: `iceberg_rest_data` and `kafka_data` were removed on 10/11/2026 when
# the Iceberg catalog and the Kafka broker were deleted from the project.
volumes:
  mysql_data:
  minio_data:
